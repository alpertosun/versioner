name: release
permissions:
  contents: read

on:
  push:
    tags:
      - '*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/checks.yml

  build:
    needs: verify
    name: build-${{ matrix.goos }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""

    env:
      APP_NAME: versioner
      VERSION: ${{ github.ref_name }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/${APP_NAME}_${{ matrix.goos }}${{ matrix.ext }}"
          SRC="./cmd"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "${OUT}" "${SRC}"

      - name: Package (linux/macos)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          BASENAME="${APP_NAME}_${{ matrix.goos }}"
          tar -czf "${BASENAME}.tar.gz" "${BASENAME}"
          rm -f "${BASENAME}"

      - name: Package (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          cd dist
          $name = "${env:APP_NAME}_windows"
          Compress-Archive -Path "$name${{ matrix.ext }}" -DestinationPath "$name.zip" -Force
          Remove-Item "$name${{ matrix.ext }}"

      - name: Checksums (linux/macos)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          OUT="SHA256SUMS_${{ matrix.goos }}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.tar.gz > "$OUT"
          else
            shasum -a 256 *.tar.gz > "$OUT"
          fi

      - name: Checksums (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          cd dist
          $out = "SHA256SUMS_windows.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          Get-ChildItem -File -Filter '*.zip' | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -FilePath $out -Append -Encoding ascii
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.goos }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Gather files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -maxdepth 3 -type f -exec cp {} out/ \;
          ls -lah out

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
